          key_insight: "Cheapest API option at 62.26 MTEB — cost/quality tradeoff for budget-conscious deployments"
          what_we_learn: "Budget API embeddings underperform open-weight models; self-hosted is better value"
          plico_gap: "Our Qwen3-0.6B likely matches or exceeds this at zero marginal cost"
      - name: "Microsoft Harrier"
        mteb_avg: null
