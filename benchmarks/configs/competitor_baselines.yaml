          key_insight: "64.60 MTEB at $0.13/M tokens — expensive but below open-weight leaders"
          what_we_learn: "OpenAI embeddings are not the best value; open-weight models outperform at zero marginal cost"
          plico_gap: "Self-hosted Qwen3 eliminates per-query cost; accuracy gap is manageable with architecture improvements"
