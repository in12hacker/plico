          architecture: "Brute-force: entire conversation in context window"
          key_insight: "26K tokens/query at $0.02/query — unsustainable beyond prototype scale"
          what_we_learn: "Token efficiency is a production requirement, not an optimization"
          plico_gap: "Our L0/L1/L2 layering targets <1K tokens for common queries"
      - name: "Zep"
        tokens: 3911
        cost_per_query_usd: 0.003129
        context_footprint_pct: 15.02
        notes: ""
        analysis:
          architecture: "Graph-based retrieval, 3,911 tokens/query"
          key_insight: "3.9K tokens is 85% reduction from full-context but 3x Memori's cost"
          what_we_learn: "Graph retrieval adds token overhead; need to balance graph richness with token budget"
          plico_gap: "Our KG-based retrieval must stay under 2K tokens to beat Memori's efficiency"
      - name: "Mem0"
        tokens: 1764
        cost_per_query_usd: 0.001411
        context_footprint_pct: 6.78
        notes: ""
        analysis:
          architecture: "Simple extraction, 1,764 tokens/query"
          key_insight: "1.7K tokens is efficient but accuracy (62.47%) shows extraction quality matters more than token count"
          what_we_learn: "Low token count without quality extraction is false economy"
          plico_gap: "Our token efficiency should match Mem0's count but with much higher accuracy"
      - name: "Memori"
        tokens: 1294
        cost_per_query_usd: 0.001035
        context_footprint_pct: 4.97
        notes: "Best accuracy/token ratio."
        analysis:
          architecture: "Structured memory extraction, 1,294 tokens/query"
          key_insight: "Best accuracy/token: 81.95% at 1.3K tokens — the benchmark to beat"
          what_we_learn: "Structured memory extraction achieves 5% context footprint with minimal accuracy loss"
          plico_gap: "Our L0+L1 combined should target <1.3K tokens while maintaining search quality"

retrieval:
  mteb:
    description: "MTEB English leaderboard — embedding model ranking"
    metric: "mteb_average_score"
    source: "https://awesomeagents.ai/leaderboards/embedding-model-leaderboard-mteb-april-2026/"
    date: "2026-04"
    competitors:
      - name: "Gemini Embedding 001"
        mteb_avg: 68.32
        retrieval: 67.71
        dims: 3072
        max_tokens: 8192
        pricing: "~$0.004/1K chars"
        notes: "#1 English MTEB. Google API."
        analysis:
          architecture: "Google's proprietary embedding model, 3072 dims, API-only"
          key_insight: "MTEB #1 but retrieval-specific score (67.71) is lower than general MTEB avg — retrieval is a distinct skill"
          what_we_learn: "High MTEB avg doesn't guarantee high retrieval; optimize for retrieval-specific metrics"
          plico_gap: "We use Qwen3-0.6B (1024 dims); Gemini's 3x dimension advantage shows in MTEB scores"
      - name: "Qwen3-Embedding-8B"
        mteb_avg: 70.58
        dims: 4096
        max_tokens: 32768
        pricing: "Free (open-weight)"
        notes: "#3 overall. Best self-hosted. vLLM/SGLang support."
        analysis:
          architecture: "Qwen3 family, 8B params, 4096 dims, open-weight, vLLM/SGLang support"
          key_insight: "Best self-hosted model at 70.58 MTEB — proves open-weight can compete with proprietary"
          what_we_learn: "Qwen3 family scales well: 0.6B→8B gives significant MTEB improvement; same family simplifies migration"
          plico_gap: "Our Qwen3-0.6B is 13x smaller; upgrading to 8B would require GPU but significantly improve retrieval"
      - name: "NV-Embed-v2"
        mteb_avg: 72.31
        retrieval: 62.65
        dims: 4096
        max_tokens: 32768
        pricing: "Free (open-weight)"
        notes: "Legacy MTEB score (56 tasks). NVIDIA."
        analysis:
          architecture: "NVIDIA's embedding model, 4096 dims, legacy MTEB (56 tasks)"
          key_insight: "Highest MTEB avg (72.31) but retrieval score (62.65) is mediocre — general vs retrieval tradeoff"
          what_we_learn: "MTEB leaderboard position doesn't predict retrieval quality; always benchmark retrieval separately"
          plico_gap: "Our retrieval@5 metric is the right evaluation; MTEB avg alone is misleading"
      - name: "BGE-en-ICL"
        mteb_avg: 71.24
        dims: 4096
        max_tokens: 32768
        pricing: "Free (open-weight)"
        notes: "BAAI. Legacy MTEB."
        analysis:
          architecture: "BAAI's in-context learning embedding, 4096 dims, legacy MTEB"
          key_insight: "71.24 MTEB with in-context learning approach — shows prompt engineering works for embeddings"
          what_we_learn: "In-context learning embeddings can achieve high MTEB scores; consider prompt-based embedding strategies"
          plico_gap: "Our embedding model doesn't use in-context learning; adding query-time context could improve scores"
      - name: "Voyage-3.1-large"
        mteb_avg: 67.40
        dims: 2048
        max_tokens: 32768
        pricing: "$0.05/M tokens"
        notes: "Best non-Google API. April 2026."
        analysis:
          architecture: "Voyage AI's flagship, 2048 dims, API-only, $0.05/M tokens"
          key_insight: "Best non-Google API at 67.40 MTEB — proves API market is competitive"
          what_we_learn: "API-based embeddings have cost implications at scale; self-hosted is more economical for high-volume"
          plico_gap: "Self-hosted Qwen3-0.6B eliminates per-query embedding cost; accuracy gap is acceptable tradeoff"
      - name: "Jina Embeddings v4"
        mteb_avg: 66.81
        dims: 1024
        max_tokens: 32768
        pricing: "Free tier + paid"
        notes: "Native multimodal (text+image). 32K context."
        analysis:
          architecture: "Jina's multimodal embedding, 1024 dims, native text+image, 32K context"
          key_insight: "Multimodal embedding at 66.81 MTEB — image+text in single vector enables cross-modal retrieval"
          what_we_learn: "Multimodal embeddings are mature enough for production; 32K context is significant for long documents"
          plico_gap: "We're text-only; multimodal could be a future capability for image/document understanding"
      - name: "BGE-M3"
        mteb_avg: 63.00
        dims: 1024
        max_tokens: 8192
        pricing: "Free (open-weight)"
        notes: "Dense+Sparse+ColBERT. BAAI."
        analysis:
          architecture: "BAAI's multi-vector model: Dense + Sparse + ColBERT, 1024 dims"
          key_insight: "Multi-representation (Dense+Sparse+ColBERT) enables hybrid search strategies"
          what_we_learn: "Sparse vectors complement dense for keyword-heavy queries; ColBERT enables late interaction"
          plico_gap: "Our BM25+HNSW hybrid is similar in spirit; ColBERT-style late interaction could improve re-ranking"
      - name: "text-embedding-3-large"
        mteb_avg: 64.60
        dims: 3072
        max_tokens: 8191
        pricing: "$0.13/M tokens"
        notes: "OpenAI."
