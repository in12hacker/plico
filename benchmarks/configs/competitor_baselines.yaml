plico:
  description: "Plico current state (v49)"
  language: "Rust"
  memory_layers: 4
  scope_isolation: "Private/Shared/Group (OS-enforced)"
  kg_native: true
  kg_edge_types: 17
  semantic_search: "native BM25+HNSW hybrid"
  session_mgmt: "OS session + warm context + delta"
  proactive_optim: "intent prefetch + skill forge + self-healing"
  wasm_skills: true
  token_efficiency: "L0/L1/L2 layered context"
  performance_recall_ms: 0.3
  performance_search_ms: 0.07
  strengths:
    - "Fastest recall latency (0.3ms vs Letta 10ms)"
    - "Only OS with native KG + WASM + 4-layer memory"
    - "Model-agnostic (zero model coupling)"
    - "Scope isolation enforced at OS level"
    - "Proactive optimization (intent prefetch, skill forge)"
  weaknesses:
    - "Memory accuracy far below specialists (F1 0.212 vs EverMind 92.73%, Mem0 91.6%, Mastra 94.87%)"
    - "No self-editing memory paradigm (Letta) or observation agents (Mastra)"
    - "No hypergraph memory (EverMind) or context offloading (TencentDB)"
    - "Limited embedding model (Qwen3-0.6B vs KaLM-12B, Harrier)"
    - "KG reasoning untested for quality (only latency)"
    - "No RAGAS-style faithfulness/relevance metrics"
    - "No multi-profile benchmark (PersonaMem)"
    - "No prompt-caching optimization (Mastra's stable context)"
    - "No extreme-scale memory test (BEAM 1M/10M)"
    - "No skills auto-distillation (EverMind Skills Evolution Engine)"
