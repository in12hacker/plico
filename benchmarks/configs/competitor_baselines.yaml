        analysis:
          architecture: "Tencent's 12B embedding model, Gemma3-based, MTEB multilingual #1"
          key_insight: "12B parameters shows scale still matters for embedding quality"
          what_we_learn: "Large embedding models (12B) can achieve top scores but require significant compute"
          plico_gap: "Our 0.6B model is 20x smaller; architecture quality must compensate for scale"

rag_quality:
  description: "RAGAS (Retrieval-Augmented Generation Assessment) — production RAG quality metrics"
  metric: "score_0_to_1"
  source: "RAGAS framework, industry baselines 2025-2026"
  note: "RAGAS is the de-facto standard for RAG pipeline evaluation. Plico should target production-grade scores."
  metrics:
    - name: "Faithfulness"
      description: "Are claims in the answer grounded in the retrieved context?"
      production_baseline: 0.85
      good_threshold: 0.90
      source: "RAGAS docs, industry consensus 2025"
    - name: "Answer Relevancy"
      description: "Does the answer address the question asked?"
      production_baseline: 0.80
      good_threshold: 0.85
      source: "RAGAS docs, industry consensus 2025"
    - name: "Context Precision"
      description: "Are the relevant items ranked higher in the context?"
      production_baseline: 0.65
      good_threshold: 0.75
      source: "RAGAS docs, industry consensus 2025"
    - name: "Context Recall"
      description: "Does the retrieved context cover all claims in the ground truth?"
      production_baseline: 0.75
      good_threshold: 0.85
      source: "RAGAS docs, industry consensus 2025"

cross_benchmarks:
  description: "Cross-cutting benchmarks for multi-hop reasoning and agent capabilities"
  note: "Not directly measured by Plico suites but relevant for capability assessment"
  hotpotqa:
    description: "HotpotQA — multi-hop question answering over Wikipedia"
    metric: "F1 / EM"
    source: "hotpotqa.github.io"
    baselines:
      - name: "DPR (Dense Passage Retrieval)"
        f1: 67.5
        em: 58.7
        date: "2020"
      - name: "IRRR"
        f1: 72.4
        em: 63.5
        date: "2021"
      - name: "Youtu-GraphRAG (Tencent)"
        f1: ~72
        notes: "Agentic graph schema, ICLR 2026"
        date: "2026"
    plico_relevance: "Our KG multi-hop reasoning (A8) is conceptually similar; HotpotQA measures retrieval+reasoning quality"
  agentbench:
    description: "AgentBench — comprehensive agent capability evaluation"
    metric: "success_rate"
    source: "THUDM/AgentBench"
    baselines:
      - name: "GPT-4o"
        overall: ~65
        notes: "Across 8 agent environments"
        date: "2024"
      - name: "Claude 3.5 Sonnet"
        overall: ~60
        notes: "Competitive on coding/web agent tasks"
        date: "2024"
    plico_relevance: "Measures agent tool-use and planning; Plico's WASM skills and intent routing are related capabilities"
