# Competitor Baselines — Hardcoded Reference Data
# Updated: 2026-05-15 from verified sources
#
# Sources:
# - LongMemEval: hindsight-benchmarks (vectorize-io), OMEGA whitepaper
# - LoCoMo: Memori Labs benchmark page
# - MTEB: awesomeagents.ai leaderboard April 2026
# - Memori token stats: Memori Labs docs
#
# Each entry: score, source URL, date, methodology notes

memory:
  longmemeval:
    description: "LongMemEval (ICLR 2025) — 500 questions, 5 capability areas"
    metric: "overall_accuracy_pct"
    source: "https://github.com/vectorize-io/hindsight-benchmarks"
    categories:
      - single_session_user
      - single_session_assistant
      - preference_application
      - knowledge_update
      - temporal_reasoning
    competitors:
      - name: "Full-context GPT-4o (ceiling)"
        overall: 60.2
        single_session_user: 81.4
        single_session_assistant: 94.6
        preference_application: 20.0
        knowledge_update: 78.2
        temporal_reasoning: 45.1
        notes: "Passes entire conversation to GPT-4o. Impractical at scale."
        source: "hindsight-benchmarks README"
        date: "2026-02"
        analysis:
          architecture: "Brute-force: passes entire conversation history to GPT-4o"
          key_insight: "Even with unlimited context, 60% is the ceiling — retrieval is necessary"
          what_we_learn: "Full-context is not the answer; smart retrieval beats brute force"
          plico_gap: "Our retrieval-based approach is correct in principle; the gap is in retrieval quality"
      - name: "Hindsight (Gemini-3)"
        overall: 91.4
        single_session_user: 97.1
        single_session_assistant: 96.4
        preference_application: 80.0
        knowledge_update: 94.9
        temporal_reasoning: 87.2
        notes: "Best overall. Local PostgreSQL, no cloud. Memory architecture drives performance."
        source: "hindsight-benchmarks README"
        date: "2026-02"
        analysis:
          architecture: "Local PostgreSQL + structured memory with explicit capability areas"
          key_insight: "Per-capability scoring reveals where memory systems excel vs struggle"
          what_we_learn: "Track temporal/multi-hop/preference accuracy separately; preference (80%) and temporal (87%) are hardest"
          plico_gap: "We don't track per-capability accuracy; F1 metric masks category-specific weaknesses"
      - name: "Hindsight (OSS-20B)"
        overall: 83.6
        single_session_user: 92.9
        single_session_assistant: 80.4
        preference_application: 56.7
        knowledge_update: 83.3
        temporal_reasoning: 62.4
        notes: "+44.6pp vs full-context OSS-20B baseline (39.0%). Architecture > model size."
        source: "hindsight-benchmarks README"
        date: "2026-02"
        analysis:
          architecture: "Same Hindsight architecture with smaller 20B model"
          key_insight: "+44.6pp improvement over full-context baseline proves architecture > model size"
          what_we_learn: "Invest in memory architecture, not just bigger models"
          plico_gap: "Our Qwen3-0.6B is even smaller; architecture quality is the lever"
      - name: "OMEGA"
        overall: 95.4
        single_session_user: 99.2
        single_session_assistant: 99.2
        preference_application: 100.0
        knowledge_update: 96.2
        temporal_reasoning: 94.0
        notes: "466/500 raw. bge-small ONNX, local M1 MacBook. 6-stage search pipeline. Hardest: multi-session reasoning (83.5%)."
        source: "https://omegamax.co/benchmarks"
        date: "2026-02"
        analysis:
          architecture: "6-stage search pipeline (retrieve → rerank → filter → merge → deduplicate → answer), bge-small ONNX"
          key_insight: "Multi-stage search dramatically outperforms single-pass retrieval"
          what_we_learn: "Add reranking stage to search; multi-session reasoning (83.5%) is the hardest category"
          plico_gap: "Our single-pass BM25+HNSW lacks reranking and multi-stage refinement"
      - name: "Supermemory (Gemini-3)"
        overall: 85.2
        notes: "Per-category breakdown not published. GPT-4o variant: 73% multi-session."
        source: "hindsight-benchmarks README"
        date: "2026-02"
        analysis:
          architecture: "Experimental pipeline, cloud-dependent"
          key_insight: "85% with Gemini-3 shows cloud models can compensate for architecture gaps"
          what_we_learn: "Cloud API quality can partially offset architecture limitations"
          plico_gap: "We are self-hosted; need architecture quality to compensate for smaller models"
      - name: "Supermemory (GPT-4o)"
        overall: 81.6
        notes: "Per-category breakdown not published."
        source: "hindsight-benchmarks README"
        date: "2026-02"
        analysis:
          architecture: "Experimental pipeline with GPT-4o"
          key_insight: "4pp drop from Gemini-3 to GPT-4o shows model quality matters within same architecture"
          what_we_learn: "Model choice affects accuracy even with identical pipeline"
          plico_gap: "Our LLM (Gemma 4 26B) is smaller; need architecture to compensate"
      - name: "Mastra Observational Memory"
        overall: 94.87
        notes: "Observer + Reflector background agents, stable context window (prompt-cacheable). Open-source."
        source: "Mastra AI blog"
        date: "2026-02"
        analysis:
          architecture: "Two background agents (Observer + Reflector) maintain dense observation log; stable context window enables prompt caching"
          key_insight: "94.87% with gpt-5-mini — observation-based memory achieves near-OMEGA scores with simpler architecture"
          what_we_learn: "Background observation agents can replace complex retrieval pipelines; stable context enables prompt caching"
          plico_gap: "Our skill forge is conceptually similar but not benchmarked for memory quality"
      - name: "Supermemory (experimental)"
        overall: 99.0
        notes: "Claimed 'agent memory frontier breakthrough'. Methodology details pending."
        source: "Supermemory blog"
        date: "2026-03"
        analysis:
          architecture: "Experimental pipeline, details not fully disclosed"
          key_insight: "99% suggests near-perfect memory is achievable with sufficient engineering"
          what_we_learn: "The ceiling for memory systems is higher than OMEGA's 95.4% suggested"
          plico_gap: "Gap is enormous; need systematic improvement across all capability areas"
      - name: "Mem0 (new algorithm)"
        overall: 93.4
        notes: "April 2026 algorithm update. Jumped from 67.8%. 6.8K tokens, 1.09s latency."
        source: "https://github.com/mem0ai/mem0/"
        date: "2026-04"
        analysis:
          architecture: "New memory algorithm with structured extraction, 6.8K tokens/query"
          key_insight: "93.4% — now competitive with OMEGA (95.4%) and Mastra (94.87%)"
          what_we_learn: "Mem0's dramatic improvement shows the memory algorithm space is still rapidly evolving"
          plico_gap: "93.4% vs our F1-based metrics — need to adopt accuracy_pct evaluation to compare"

  personamem:
    description: "PersonaMem (Tencent, 2026) — 20 user profiles, 6462 context items, 589 hard reasoning questions"
    metric: "accuracy_pct"
    source: "Tencent Cloud Agent Memory evaluation"
    date: "2026-04"
    categories:
      - user_fact_recall
      - hard_reasoning
    competitors:
      - name: "Tencent AgentMemory"
        overall: 76.10
        notes: "Top1. +59% over native OpenClaw. 79%+ user fact recall (from <30%)."
        source: "Tencent Cloud"
        date: "2026-04"
        analysis:
          architecture: "Production-grade agent memory with structured user profiles"
          key_insight: "76.10% on realistic multi-profile scenario — production memory is harder than single-benchmark"
          what_we_learn: "Multi-profile scenarios expose weaknesses that single-profile benchmarks miss"
          plico_gap: "We haven't tested multi-profile scenarios; scope isolation tests are basic"
      - name: "EverMind (EverOS)"
        overall: null
        notes: "#2 on PersonaMem. Open-source memory layer for AI agents."
        source: "EverOS GitHub"
        date: "2026-04"
        analysis:
          architecture: "Open-source memory layer, hierarchical storage"
          key_insight: "Open-source competitor to Tencent's proprietary solution"
          what_we_learn: "Open-source memory layers are competitive; ecosystem is maturing"
          plico_gap: "Our 4-layer memory is more granular; need to benchmark on PersonaMem"

  locomo:
    description: "LoCoMo — long conversational memory, LLM-as-Judge accuracy %"
    metric: "overall_accuracy_pct"
    source: "https://memorilabs.ai/docs/memori-cloud/benchmark/results/"
    categories:
      - single_hop
      - multi_hop
      - open_domain
      - temporal
    competitors:
      - name: "Full-Context (ceiling)"
        overall: 87.52
        single_hop: 88.53
        multi_hop: 77.70
        open_domain: 71.88
        temporal: 92.70
        notes: "Impractical: 26,031 tokens/query average."
        source: "Memori Labs"
        date: "2026-02"
        analysis:
          architecture: "Brute-force: passes entire conversation history to LLM"
          key_insight: "87.52% ceiling with 26K tokens/query — retrieval systems can approach this at 5% token cost"
          what_we_learn: "The gap between full-context (87.52%) and best retrieval (81.95%) is only 5.57pp — retrieval is viable"
          plico_gap: "Our accuracy_pct needs to reach ~82% to match Memori; current F1-based metrics aren't comparable"
      - name: "Memori"
        overall: 81.95
        single_hop: 87.87
        multi_hop: 72.70
        open_domain: 63.54
        temporal: 80.37
        notes: "Best retrieval-based. 1,294 tokens/query (4.97% of full context)."
        source: "Memori Labs"
        date: "2026-02"
        analysis:
          architecture: "Structured memory extraction + semantic retrieval, 1,294 tokens/query"
          key_insight: "Best accuracy/token ratio: 81.95% at 4.97% of full context cost"
          what_we_learn: "Structured memory extraction beats raw retrieval; open_domain (63.54%) is weakest category"
          plico_gap: "Our token efficiency (L0/L1/L2) is competitive; accuracy gap is in retrieval quality"
      - name: "Zep"
        overall: 79.09
        single_hop: 79.43
        multi_hop: 69.16
        open_domain: 73.96
        temporal: 83.33
        notes: "3,911 tokens/query."
        source: "Memori Labs"
        date: "2026-02"
        analysis:
          architecture: "Graph-based memory with temporal awareness, 3,911 tokens/query"
          key_insight: "Best open_domain (73.96%) among retrieval systems — graph structure helps cross-topic queries"
          what_we_learn: "Graph-based memory improves open-domain retrieval; 3x token cost vs Memori for 2.86pp less accuracy"
          plico_gap: "Our KG (redb, 17 edge types) is more sophisticated; should leverage it for open-domain queries"
      - name: "LangMem"
        overall: 78.05
        single_hop: 74.47
        multi_hop: 61.06
        open_domain: 67.71
        temporal: 86.92
        notes: "Best temporal reasoning among retrieval systems."
        source: "Memori Labs"
        date: "2026-02"
        analysis:
          architecture: "LangChain-integrated memory with temporal indexing"
          key_insight: "Best temporal reasoning (86.92%) among retrieval systems — temporal indexing works"
          what_we_learn: "Dedicated temporal indexing dramatically improves time-based queries; weakest at multi_hop (61.06%)"
          plico_gap: "Our temporal_reasoning suite should target 87%+; KG causal edges could enable multi-hop improvement"
      - name: "Mem0 (legacy)"
        overall: 62.47
        single_hop: 62.41
        multi_hop: 57.32
        open_domain: 44.79
        temporal: 66.47
        notes: "Pre-2026 algorithm. Weakest across all categories."
        source: "Memori Labs"
        date: "2026-02"
        analysis:
          architecture: "Simple extraction-based memory, minimal structuring"
          key_insight: "62.47% overall — naive extraction without structure performs poorly across all categories"
          what_we_learn: "Memory architecture quality matters enormously: 19.48pp gap to Memori with same underlying models"
          plico_gap: "Our 4-layer memory (Ephemeral→Working→Long-term→Procedural) should far exceed Mem0's flat approach"
      - name: "Mem0 (new algorithm)"
        overall: 91.6
        notes: "April 2026 algorithm update. Dramatic jump from 62.47%. 7K tokens, 0.88s latency."
        source: "https://github.com/mem0ai/mem0/"
        date: "2026-04"
        analysis:
          architecture: "New memory algorithm with structured extraction + semantic retrieval, 7K tokens/query"
          key_insight: "29pp improvement (62.47%→91.6%) proves algorithm quality matters more than incremental tuning"
          what_we_learn: "A single algorithm redesign can dramatically close the gap; don't assume competitors are static"
          plico_gap: "Now 91.6% vs our F1-based metrics — the gap is enormous; need accuracy_pct comparable to LoCoMo"
      - name: "EverMind HyperMem"
        overall: 92.73
        notes: "Hypergraph-based hierarchical memory. Best publicly claimed LoCoMo score."
        source: "https://github.com/EverMind-AI"
        date: "2026-04"
        analysis:
          architecture: "Hypergraph hierarchical memory (HyperMem), part of EverOS self-evolving agent framework"
          key_insight: "92.73% with hypergraph structure — graph-based memory outperforms flat retrieval"
          what_we_learn: "Hierarchical graph memory is the current state-of-the-art; our KG could serve similar role"
          plico_gap: "Our redb KG with 17 edge types is more sophisticated but not benchmarked for memory quality"
      - name: "delta-mem"
        overall: null
        notes: "1.20x improvement over baseline. 0.12% of backbone params. TTL subtask: 26.14→50.50."
        source: "arXiv May 2026"
        date: "2026-05"
        analysis:
          architecture: "Lightweight memory mechanism (0.12% of backbone params), TTL-based subtask"
          key_insight: "1.31x on MemoryAgentBench, 1.20x on LoCoMo — minimal parameters, maximal improvement"
          what_we_learn: "Architectural innovation matters more than scale; lightweight mechanisms can dramatically improve memory"
          plico_gap: "Our memory architecture is already sophisticated; need to measure improvement delta"

  token_efficiency:
    description: "Tokens per query vs accuracy tradeoff"
    metric: "tokens_per_query"
    source: "Memori Labs benchmark page"
    competitors:
      - name: "Full-Context"
        tokens: 26031
        cost_per_query_usd: 0.020825
        context_footprint_pct: 100.0
        notes: "Unsustainable at scale."
