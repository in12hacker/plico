[package]
name = "plico"
version = "0.1.0"
edition = "2021"
description = "太初 (Plico) — AI-native operating system kernel designed entirely from AI perspective"
license = "MIT OR Apache-2.0"
repository = "https://github.com/in12hacker/plico"
readme = "README.md"
keywords = ["ai-os", "semantic-search", "knowledge-graph", "agent", "memory"]
categories = ["command-line-utilities", "database", "compilers"]

[features]
default = []
wasmtime-backend = ["wasmtime", "wat"]
offline-migration = []

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "blocking"] }
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
lru = "0.17"
bm25 = "2.3.2"
hmac = "0.12"
time = "0.3"
rand = "0.9"
dirs = "5.0"
# edgevec removed: replaced by usearch (458K downloads, industry-standard HNSW)
subtle = "2.6.1"
redb = "4.0"
tempfile = "3.0"
rustix = { version = "1.1", features = ["fs"] }
parcopy = "0.3.2"
walkdir = "2.5.0"
zeroize = { version = "1.8", features = ["derive"] }

libc = "0.2.186"
usearch = "2.25.1"

# WASM runtime (optional)
wasmtime = { version = "44.0.1", optional = true }
wat = { version = "1.248.0", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "plicod"
path = "src/bin/plicod.rs"

[[bin]]
name = "aicli"
path = "src/bin/aicli/main.rs"

[[bin]]
name = "plico-mcp"
path = "src/bin/plico_mcp/main.rs"

[[bin]]
name = "plico-memory-migrate"
path = "src/bin/plico_memory_migrate/main.rs"
required-features = ["offline-migration"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
